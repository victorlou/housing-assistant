bundle:
  name: gtfs_auckland_transport

variables:
  jobs_service_principal_id:
    description: Application ID of the sp-housing-jobs service principal.
  admins_group_name:
    description: Account-level admin group whose members can deploy and manage this bundle.
  notification_email:
    description: Email to alert on job failure.
  metroinfo_url:
    description: Metroinfo (Christchurch) static GTFS URL. Subject to access approval.
    default: https://apis.metroinfo.co.nz/rti/gtfs/v1/gtfs.zip
  metroinfo_secret_scope:
    description: Databricks secret scope holding the Metroinfo API key.
    default: housing-assistant
  metroinfo_secret_key:
    description: Databricks secret key (within the scope) holding the Metroinfo API key.
    default: metroinfo_api_key

# Permissions applied to every bundle resource AND the workspace folder where
# files are deployed. See ./README.md for the deploy model.
permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.jobs_service_principal_id}
  - level: CAN_MANAGE
    group_name: ${var.admins_group_name}
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

resources:
  pipelines:
    # Pipelines are feed-agnostic. The bronze layer reads from per-file-type
    # directories that contain landings from every configured feed; the
    # `_feed_source` column distinguishes them downstream.
    gtfs_bronze:
      name: gtfs_bronze
      catalog: housing
      schema: bronze
      serverless: true
      development: false
      edition: ADVANCED
      # Pipelines run as the jobs SP — same identity as the job. Tables they
      # create are owned by this SP, not by whoever deployed the bundle.
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: gtfs
        layer: bronze
      libraries:
        - notebook:
            path: ./notebooks/bronze.py

    gtfs_silver:
      name: gtfs_silver
      catalog: housing
      schema: silver
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: gtfs
        layer: silver
      libraries:
        - notebook:
            path: ./notebooks/silver.py

    gtfs_gold:
      name: gtfs_gold
      catalog: housing
      schema: gold
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: gtfs
        layer: gold
      libraries:
        - notebook:
            path: ./notebooks/gold.py

  jobs:
    gtfs_ingest:
      name: gtfs_ingest
      description: |
        Weekly fetch of New Zealand GTFS feeds (Auckland Transport, Metlink,
        BUSIT/Waikato, Metroinfo/Christchurch) followed by bronze → silver →
        gold transformations. Owned by the housing-assistant project.
        See ./README.md.

      tags:
        project: housing-assistant
        source: gtfs

      run_as:
        service_principal_name: ${var.jobs_service_principal_id}

      schedule:
        # Sunday 03:00 Pacific/Auckland — well after weekend service changes
        # are published across NZ regions.
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: Pacific/Auckland
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      timeout_seconds: 7200

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        # ─── Fetches (parallel, one per feed) ────────────────────────
        - task_key: fetch_auckland_transport
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              feed_source: auckland_transport
              source_url: "https://gtfs.at.govt.nz/gtfs.zip"
              retention_days: "90"

        - task_key: fetch_metlink
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              feed_source: metlink
              source_url: "https://static.opendata.metlink.org.nz/v1/gtfs/full.zip"
              retention_days: "90"

        - task_key: fetch_busit
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              feed_source: busit
              source_url: "https://wrcscheduledata.blob.core.windows.net/wrcgtfs/busit-nz-public.zip"
              retention_days: "90"

        # Metroinfo (Christchurch) needs an API key. Until the secret is
        # configured in `${var.metroinfo_secret_scope}/${var.metroinfo_secret_key}`,
        # this task logs `status='skipped'` in ingest_runs and exits cleanly.
        - task_key: fetch_metroinfo
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              feed_source: metroinfo
              source_url: ${var.metroinfo_url}
              retention_days: "90"
              auth_secret_scope: ${var.metroinfo_secret_scope}
              auth_secret_key: ${var.metroinfo_secret_key}
              auth_header_name: Ocp-Apim-Subscription-Key

        # ─── Transforms (sequential, run after every fetch finishes) ──
        # ALL_DONE: run after every fetch is done regardless of pass/fail/skip,
        # so a single failing feed doesn't block the rest of the lakehouse.
        - task_key: transform_bronze
          depends_on:
            - task_key: fetch_auckland_transport
            - task_key: fetch_metlink
            - task_key: fetch_busit
            - task_key: fetch_metroinfo
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.gtfs_bronze.id}

        - task_key: transform_silver
          depends_on:
            - task_key: transform_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.gtfs_silver.id}

        - task_key: transform_gold
          depends_on:
            - task_key: transform_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.gtfs_gold.id}

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-c3095737-46ec.cloud.databricks.com
      profile: hackathon
    variables:
      jobs_service_principal_id: e61d2aac-5a1a-476e-b4a5-fb88f9be1bf3
      admins_group_name: housing-assistant-dev-admins
      notification_email: victor.lourenco@zuru.com

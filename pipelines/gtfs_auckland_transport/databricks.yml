bundle:
  name: gtfs_auckland_transport

variables:
  jobs_service_principal_id:
    description: Application ID of the sp-housing-jobs service principal.
  notification_email:
    description: Email to alert on job failure.

# Grant the run-as SP permissions on every bundle resource AND on the workspace
# folder where the notebook is deployed. Without this, the SP can read neither
# the job definition nor the notebook file, even though the job is configured
# to run as the SP.
permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.jobs_service_principal_id}

resources:
  jobs:
    gtfs_auckland_transport_ingest:
      name: gtfs_auckland_transport_ingest
      description: |
        Weekly fetch of the Auckland Transport GTFS feed to bronze.
        Owned by the housing-assistant project. See ./README.md.

      tags:
        project: housing-assistant
        source: gtfs_auckland_transport

      run_as:
        service_principal_name: ${var.jobs_service_principal_id}

      schedule:
        # Sunday 03:00 Pacific/Auckland — well after weekend service changes
        # are published.
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: Pacific/Auckland
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      timeout_seconds: 1800

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        - task_key: fetch
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              # Auckland Transport's canonical static GTFS endpoint.
              # Documented at https://at.govt.nz/about-us/at-data-sources/general-transit-feed-specification
              source_url: "https://gtfs.at.govt.nz/gtfs.zip"
              retention_days: "90"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-c3095737-46ec.cloud.databricks.com
      # Pin the CLI profile so deploys don't pick up the wrong DEFAULT.
      # Teammates: run `databricks configure --profile hackathon` against the
      # same host and you'll get the same behaviour without env vars.
      profile: hackathon
    variables:
      jobs_service_principal_id: e61d2aac-5a1a-476e-b4a5-fb88f9be1bf3
      notification_email: victor.lourenco@zuru.com

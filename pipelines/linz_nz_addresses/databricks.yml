bundle:
  name: linz_nz_addresses

variables:
  jobs_service_principal_id:
    description: Application ID of the sp-housing-jobs service principal.
  admins_group_name:
    description: Account-level admin group whose members can deploy and manage this bundle.
  notification_email:
    description: Email to alert on job failure.

permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.jobs_service_principal_id}
  - level: CAN_MANAGE
    group_name: ${var.admins_group_name}
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

resources:
  pipelines:
    linz_nz_addresses_bronze:
      name: linz_nz_addresses_bronze
      catalog: housing
      schema: bronze
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: linz_nz_addresses
        layer: bronze
        pipelines.maxFlowRetryAttempts: "0"
      libraries:
        - notebook:
            path: ./notebooks/bronze.py

    linz_nz_addresses_silver:
      name: linz_nz_addresses_silver
      catalog: housing
      schema: silver
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: linz_nz_addresses
        layer: silver
        pipelines.maxFlowRetryAttempts: "0"
      libraries:
        - notebook:
            path: ./notebooks/silver.py

    linz_nz_addresses_gold:
      name: linz_nz_addresses_gold
      catalog: housing
      schema: gold
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: linz_nz_addresses
        layer: gold
        pipelines.maxFlowRetryAttempts: "0"
      libraries:
        - notebook:
            path: ./notebooks/gold.py

  jobs:
    linz_nz_addresses_ingest:
      name: linz_nz_addresses_ingest
      description: |
        Scheduled fetch of LINZ NZ Addresses WFS, then bronze → silver → gold.
        Owned by the housing-assistant project. See ./README.md.

      tags:
        project: housing-assistant
        source: linz_nz_addresses

      run_as:
        service_principal_name: ${var.jobs_service_principal_id}

      schedule:
        quartz_cron_expression: "0 0 4 ? * MON"
        timezone_id: Pacific/Auckland
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      timeout_seconds: 7200

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        - task_key: fetch_nz_addresses
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              feed_source: nz_addresses
              retention_days: "90"
              auth_secret_scope: housing-assistant
              auth_secret_key: linz_api_key

        - task_key: transform_bronze
          depends_on:
            - task_key: fetch_nz_addresses
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.linz_nz_addresses_bronze.id}

        - task_key: transform_silver
          depends_on:
            - task_key: transform_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.linz_nz_addresses_silver.id}

        - task_key: transform_gold
          depends_on:
            - task_key: transform_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.linz_nz_addresses_gold.id}

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-c3095737-46ec.cloud.databricks.com
      profile: hackathon
    variables:
      jobs_service_principal_id: e61d2aac-5a1a-476e-b4a5-fb88f9be1bf3
      admins_group_name: housing-assistant-dev-admins
      notification_email: isabelbody@zuru.com

bundle:
  name: linz_nz_addresses

variables:
  catalog:
    description: Unity Catalog name for the DLT pipeline (must match Terraform catalog_name).
    default: housing
  jobs_service_principal_id:
    description: Application ID of the sp-housing-jobs service principal.
  notification_email:
    description: Email to alert on job failure.

permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.jobs_service_principal_id}

resources:
  jobs:
    linz_nz_addresses_ingest:
      name: linz_nz_addresses_ingest
      description: |
        Scheduled fetch of LINZ NZ Addresses WFS to bronze.
        Owned by the housing-assistant project. See ./README.md.

      tags:
        project: housing-assistant
        source: linz_nz_addresses

      run_as:
        service_principal_name: ${var.jobs_service_principal_id}

      schedule:
        quartz_cron_expression: "0 0 4 ? * MON"
        timezone_id: Pacific/Auckland
        pause_status: UNPAUSED

      max_concurrent_runs: 1
      timeout_seconds: 7200

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        - task_key: fetch
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              retention_days: "90"
              secret_scope: ""
              secret_key: "linz_api_key"

  pipelines:
    linz_nz_addresses:
      name: housing_assistant_linz_nz_addresses
      catalog: ${var.catalog}
      target: bronze
      development: true
      channel: CURRENT
      serverless: true
      libraries:
        - file:
            path: ./transformations/bronze.sql

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-c3095737-46ec.cloud.databricks.com
      profile: hackathon
    variables:
      catalog: housing
      jobs_service_principal_id: e61d2aac-5a1a-476e-b4a5-fb88f9be1bf3
      notification_email: victor.lourenco@zuru.com

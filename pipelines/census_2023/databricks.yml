bundle:
  name: census_2023

variables:
  jobs_service_principal_id:
    description: Application ID of the sp-housing-jobs service principal.
  admins_group_name:
    description: Account-level admin group whose members can deploy and manage this bundle.
  notification_email:
    description: Email to alert on job failure.

permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.jobs_service_principal_id}
  - level: CAN_MANAGE
    group_name: ${var.admins_group_name}
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

resources:
  pipelines:
    census_2023_bronze:
      name: census_2023_bronze
      catalog: housing
      schema: bronze
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: census_2023
        layer: bronze
      libraries:
        - notebook:
            path: ./notebooks/bronze.py

    census_2023_silver:
      name: census_2023_silver
      catalog: housing
      schema: silver
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: census_2023
        layer: silver
      libraries:
        - notebook:
            path: ./notebooks/silver.py

    census_2023_gold:
      name: census_2023_gold
      catalog: housing
      schema: gold
      serverless: true
      development: false
      edition: ADVANCED
      run_as:
        service_principal_name: ${var.jobs_service_principal_id}
      configuration:
        project: housing-assistant
        source: census_2023
        layer: gold
      libraries:
        - notebook:
            path: ./notebooks/gold.py

  jobs:
    census_2023_ingest:
      name: census_2023_ingest
      description: |
        Fetch 2023 Census SA2 households and dwellings from Stats NZ ArcGIS,
        then bronze → silver → gold. See ./README.md.

      tags:
        project: housing-assistant
        source: census_2023

      run_as:
        service_principal_name: ${var.jobs_service_principal_id}

      # Census is a static snapshot; run on demand or un-pause for annual refresh.
      schedule:
        quartz_cron_expression: "0 0 5 1 3 ?"
        timezone_id: Pacific/Auckland
        pause_status: PAUSED

      max_concurrent_runs: 1
      timeout_seconds: 10800

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        - task_key: fetch_households_sa2
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              layer_key: households_sa2
              retention_days: "365"

        - task_key: fetch_dwellings_sa2
          notebook_task:
            notebook_path: ./notebooks/fetch.py
            base_parameters:
              layer_key: dwellings_sa2
              retention_days: "365"

        - task_key: transform_bronze
          depends_on:
            - task_key: fetch_households_sa2
            - task_key: fetch_dwellings_sa2
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.census_2023_bronze.id}

        - task_key: transform_silver
          depends_on:
            - task_key: transform_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.census_2023_silver.id}

        - task_key: transform_gold
          depends_on:
            - task_key: transform_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.census_2023_gold.id}

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-c3095737-46ec.cloud.databricks.com
      profile: hackathon
    variables:
      jobs_service_principal_id: e61d2aac-5a1a-476e-b4a5-fb88f9be1bf3
      admins_group_name: housing-assistant-dev-admins
      notification_email: victor.lourenco@zuru.com

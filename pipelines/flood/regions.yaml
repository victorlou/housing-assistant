# Regional council / city flood hazard polygon layers (ArcGIS).
# Verified queryable 2026-05-17. See .devnotes/flood/access-paths.md.

layers:
  - id: auckland_flood_plains
    publisher: Auckland Council
    region_name: Auckland
    return_period: "100-year"
    aep: null
    base: https://services1.arcgis.com/n4yPwebTjJCmXB6W/arcgis/rest/services/Flood_Plains/FeatureServer
    layer_id: 0
    file_stem: auckland_flood_plains
    notes: Regionwide Urban Flood Model; RAINFALL_EVENT=100. Primary fluvial/pluvial plain polygons (~12.7k).


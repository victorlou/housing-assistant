# Canonical registry of open data sources used by Housing Assistant.
# See docs/data-sources.md for human-readable descriptions and rationale.
# Ingestion pipelines parse this file to know what to fetch.

sources:
  - name: census_2023
    publisher: Stats NZ
    licence: CC-BY-4.0
    url: https://2023census-statsnz.hub.arcgis.com/
    auth: none
    cadence: per_census
    ingestion_pipeline: pipelines/census_2023
    target_tables:
      - housing.silver.census_sa2_metric
      - housing.silver.census_sa2_features
      - housing.gold.income__year__suburb
      - housing.gold.tenure__year__suburb
      - housing.gold.rent__year__suburb
      - housing.gold.crowding__year__suburb
      - housing.gold.dwelling__year__suburb
      - housing.gold.census_metric__year__sa2
    tier: 1
    notes: |
      2023 Census households, dwellings, and individuals by SA2 via ArcGIS FeatureServer.
      Enriches housing.gold.suburb (places). NZDep is a separate ingest. TA-level census
      summaries also exist in housing_indicators (HUD).

  - name: places
    publisher: Stats NZ
    licence: CC-BY-4.0
    url: https://datafinder.stats.govt.nz/
    auth: api-key
    cadence: quarterly
    ingestion_pipeline: pipelines/places
    target_tables:
      - housing.gold.suburb
      - housing.gold.h3_cell
    tier: 1
    notes: |
      SA2 2023 polygons and canonical suburb dimension; census demographics joined from
      housing.silver.census_sa2_features after census_2023_ingest.

  - name: linz_nz_addresses
    publisher: Toitū Te Whenua LINZ
    licence: CC-BY-4.0
    url: https://data.linz.govt.nz/
    auth: api-key
    cadence: continuous
    ingestion_pipeline: pipelines/linz_nz_addresses
    target_tables:
      - housing.bronze.linz_nz_addresses
      - housing.silver.nz_address
      - housing.gold.nz_address
    tier: 2
    notes: |
      NZ Addresses (layer-105689) via LDS WFS; scheduled fetch to bronze volume + DLT in pipelines/linz_nz_addresses.

  - name: police_recorded_crime
    publisher: New Zealand Police
    licence: CC-BY-4.0
    url: https://www.police.govt.nz/about-us/publications-statistics/data-and-statistics/policedatanz
    auth: none
    cadence: monthly
    ingestion_pipeline: pipelines/police_recorded_crime
    target_tables:
      - housing.bronze.police_recorded_crime_anzsoc_victimisations
      - housing.silver.crime_victimisation_monthly
      - housing.gold.crime__month__anzsoc_subdivision
    tier: 1
    notes: |
      Manual Tableau CSV to police_recorded_crime_files; job police_recorded_crime_ingest runs bronze/silver/gold pipelines.
      Current export is ANZSOC-by-month (no geography). crime__month__area_unit needs Time and Place export.

  - name: flood_hazard_regional
    publisher: Multiple (Auckland Council, GWRC, regional councils)
    licence: CC-BY-4.0
    url: https://data-aucklandcouncil.opendata.arcgis.com/
    auth: none
    cadence: annual
    ingestion_pipeline: pipelines/flood
    target_tables:
      - housing.gold.hazard
    tier: 2
    notes: |
      Twelve ArcGIS polygon layers in regions.yaml; parallel fetch job + DLT bronze/silver/gold.
      Auckland org host n4yPwebTjJCmXB6W. Overland_Flow_Paths excluded from bulk ingest.


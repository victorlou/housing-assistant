[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-assistant"
version = "0.0.0"
description = "NZ housing affordability assistant (Databricks-native monorepo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]

[tool.ruff]
line-length = 100
exclude = [".venv", ".git", "__pycache__", ".terraform", "terraform"]

[tool.ruff.lint]
select = ["F", "I", "B", "RUF"]
ignore = ["E203"]

# Databricks notebooks: `spark` and `dbutils` are injected at runtime.
[tool.ruff.lint.per-file-ignores]
"pipelines/**/notebooks/*.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "agents", "app"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]

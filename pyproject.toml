[project]
name = "housing-assistant"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".terraform",
    ".ruff_cache",
    ".venv",
    ".uv",
    ".databricks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Databricks job/DLT notebooks: spark and dbutils are runtime globals; bundle
# notebooks may adjust sys.path before importing sibling modules.
[tool.ruff.lint.per-file-ignores]
"pipelines/**/notebooks/*.py" = ["F821", "E402", "E501"]

# LINZ LDS WFS — ${LINZ_API_KEY} is expanded from the environment (same pattern as Spine config repos).
source:
  name: linz_nz_addresses
wfs:
  base_url: "https://data.linz.govt.nz/services;key=${LINZ_API_KEY}/wfs"
  version: "2.0.0"
  type_names: layer-105689
  output_format: application/json
  srs_name: EPSG:4326
  page_size: 2000
  max_pages: null
  request_timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 3.0
  extra_query_params: {}
landing:
  file_stem: linz_nz_addresses

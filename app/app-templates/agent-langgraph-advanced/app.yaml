command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: LAKEBASE_AUTOSCALING_ENDPOINT
    valueFrom: "postgres"
  - name: LAKEBASE_AGENT_MEMORY_SCHEMA
    value: "agent_langgraph_memory"
  - name: LOG_LEVEL
    value: "INFO"
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  - name: HOUSING_CATALOG
    value: "housing"
  - name: HOUSING_SCHEMA
    value: "gold"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "warehouse_secret"
  - name: DATABRICKS_GENIE_SPACE_ID
    value: "01f152668dcc14a7adb7e558769d9308"
  - name: DATABRICKS_DASHBOARD_ID
    value: "01f1526f81831b699771747499d91b7c"

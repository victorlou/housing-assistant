version: 2

sources:
  - name: bronze
    description: >
      Unity Catalog bronze tables written by ingest jobs and DLT only.
      dbt reads them here; physical bronze is not materialised by dbt models
      in this project (see bronze/*.sql — ephemeral cleanup over sources).
    database: "{{ var('uc_catalog', 'housing') }}"
    schema: bronze
    tables:
      - name: linz_nz_addresses_raw
        description: Raw LINZ NZ Addresses landing from DLT (if present).
      - name: linz_nz_addresses_features
        description: >
          Typed / feature-ready LINZ address rows produced by bronze DLT.
          Primary input for the LINZ medallion slice.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
      - name: Format check
        run: terraform fmt -check -recursive ../..
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Python files
        id: pyfiles
        run: |
          count=$(find . -type f -name '*.py' -not -path './.terraform/*' -not -path './.git/*' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count Python file(s)"
      - uses: actions/setup-python@v5
        if: steps.pyfiles.outputs.count != '0'
        with:
          python-version: "3.12"
      - name: Install ruff
        if: steps.pyfiles.outputs.count != '0'
        run: pip install ruff
      - name: Lint
        if: steps.pyfiles.outputs.count != '0'
        run: ruff check .
      - name: Format check
        if: steps.pyfiles.outputs.count != '0'
        run: ruff format --check .

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
        continue-on-error: true # advisory only for now

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install -r requirements-dbt.txt
      - name: Write stub profiles for parse-only CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          housing_assistant:
            target: ci
            outputs:
              ci:
                type: databricks
                host: https://dbc-ci-placeholder.cloud.databricks.com
                http_path: /sql/1.0/warehouses/0000000000000000
                token: dapi-ci-placeholder-not-used-for-parse-only
                catalog: housing
                schema: dbt_ci
                threads: 1
          EOF
      - name: dbt deps
        working-directory: dbt
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dbt deps --profiles-dir ~/.dbt --target ci
      - name: dbt parse
        working-directory: dbt
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dbt parse --profiles-dir ~/.dbt --target ci
